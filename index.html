<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>星河浅滩</title>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">
          <img src="./src/assets/logo.png" alt="星河浅滩" class="sidebar-brand-logo">
        </div>
        <div>
          <h1>星河浅滩</h1>
          <div class="sidebar-brand-sub">My Dashboard</div>
        </div>
      </div>
      
      <nav class="sidebar-nav" id="sidebarNav">
        <button class="sidebar-nav-item active" data-view="dashboard">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
          </span>
          <span class="nav-text">数据看板</span>
        </button>
        
        <button class="sidebar-nav-item" data-view="plans">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2" width="8" height="4" rx="1"/>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
              <path d="M9 13h2"/>
              <path d="M9 17h2"/>
              <path d="M15 13h.01"/>
              <path d="M15 17h.01"/>
            </svg>
          </span>
          <span class="nav-text">计划清单</span>
        </button>
        <button class="sidebar-nav-item" data-view="autotasks">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </span>
          <span class="nav-text">定时任务</span>
        </button>
        
        <button class="sidebar-nav-item" data-view="learning">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
            </svg>
          </span>
          <span class="nav-text">学习记录</span>
        </button>
        <button class="sidebar-nav-item" data-view="habits">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 20h10"/>
              <path d="M10 20c5.5-2.5.8-6.4 3-10"/>
              <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.6"/>
              <path d="M14.1 6a7 7 0 0 0-1.1 4c0 1 .2 1.9.5 2.8"/>
            </svg>
          </span>
          <span class="nav-text">习惯追踪</span>
        </button>
        <button class="sidebar-nav-item" data-view="finance">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
              <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
              <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
            </svg>
          </span>
          <span class="nav-text">记账账本</span>
        </button>
      </nav>
      
      <div class="sidebar-footer">
        <button class="sidebar-nav-item" data-view="settings" style="width:100%">
          <span class="nav-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </span>
          <span class="nav-text">设置中心</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main">
      <div class="main-header" id="mainHeader">
        <button class="btn btn-icon btn-ghost" id="menuBtn" aria-label="菜单" style="display:none">☰</button>
        <div>
          <div class="main-header-title" id="headerTitle">数据看板</div>
          <div class="main-header-subtitle" id="headerSub"></div>
        </div>
        <div style="flex:1"></div>
        <button class="btn btn-primary btn-sm" id="headerAction" style="display:none">＋ 新增</button>
      </div>
      <div class="main-content" id="mainContent"></div>
    </main>

    <!-- Mobile Bottom Nav (JS 动态渲染：常驻 Tab + 更多弹层) -->
    <nav class="mobile-bottom-nav" id="mobileBottomNav"></nav>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>
  <!-- Particles Container -->
  <div class="particles-container" id="particlesContainer"></div>
</body>
</html>
